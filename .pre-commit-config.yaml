# .idea/ and .vscode/ are gitignored but a few files were already tracked
# before that - excluded here so these hooks never touch IDE-generated config.
exclude: ^(\.idea|\.vscode)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv\\Scripts\\python.exe -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
